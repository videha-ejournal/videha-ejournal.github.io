name: Build Root Videha Quiz Search

on:
  push:
    branches: [main]
    paths-ignore:
      - 'pagefind-quiz/**'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: videha-root-quiz-pagefind-main
  cancel-in-progress: true

jobs:
  build-search:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse checkout HTML corpus and build tools
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.html
            /*.htm
            /**/*.html
            /**/*.htm
            /.github/
            /tools/
            /pagefind-quiz/
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare bilingual root quiz corpus
        run: python3 tools/videha-root-quiz-pagefind-prepare.py . _pagefind_quiz_build
      - name: Build Pagefind quiz index
        run: npx -y pagefind@1.5.2 --site _pagefind_quiz_build --output-subdir pagefind-quiz --glob '**/*.{html,htm}'
      - name: Install search bundle
        run: |
          rm -rf pagefind-quiz
          cp -R _pagefind_quiz_build/pagefind-quiz ./pagefind-quiz
          rm -rf _pagefind_quiz_build
      - name: Commit refreshed root quiz index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pagefind-quiz
          if git diff --cached --quiet; then
            echo "Root quiz search index unchanged."
          else
            git commit -m "Build root Videha Quiz search index"
            git push
          fi
